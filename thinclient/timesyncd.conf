[Time]
# Zeitquelle im Homelab: der Domain Controller spricht NTP.
# Gemessen am 15.11. mit echter UDP-123-Abfrage:
#   192.168.40.160  → antwortet, stratum 4
#   192.168.40.165  → antwortet nicht (auch kein Ping) — steht als zweiter
#                     Eintrag drin, falls dort ein DC dazukommt
#   192.168.20.1 / .90.1 / .40.1 (UDM) → kein NTP
# Die Pools sind der Notnagel, falls VLAN 20 → VLAN 40 auf UDP 123 zu ist.
NTP=192.168.40.160 192.168.40.165
FallbackNTP=0.debian.pool.ntp.org 1.debian.pool.ntp.org pool.ntp.org time.cloudflare.com

# Leere CMOS-Batterie: die Box startet in der Vergangenheit. Deshalb beim ersten
# Sync nicht lange messen, sondern gleich springen, und häufig genug nachsehen.
RootDistanceMaxSec=5
PollIntervalMinSec=32
PollIntervalMaxSec=1024
