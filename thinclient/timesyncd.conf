[Time]
# BEWUSST NEUTRAL: im Abbild stehen nur öffentliche Pools. Eigene Zeitserver
# (z. B. der Domain Controller eines Homelabs) gehören NICHT ins Image — die hat
# sonst niemand, der es installiert. Ein lokaler Server kommt als Drop-in:
#   /etc/systemd/timesyncd.conf.d/90-lokal.conf   mit   [Time] / NTP=<ip>
# Der ISO-Build legt das an, wenn NTP_SERVER=<ip> gesetzt ist; sonst bleibt es
# leer und es gelten die Pools. Gemessen am 15.11. (echte UDP-123-Abfrage):
# pool.ntp.org stratum 2, 0.debian.pool.ntp.org stratum 2, time.cloudflare.com
# stratum 3 — die UDM antwortet gar nicht auf NTP.
NTP=0.debian.pool.ntp.org 1.debian.pool.ntp.org 2.debian.pool.ntp.org
FallbackNTP=pool.ntp.org time.cloudflare.com

# Leere CMOS-Batterie: die Box startet in der Vergangenheit. Deshalb beim ersten
# Sync nicht lange messen, sondern gleich springen, und häufig genug nachsehen.
RootDistanceMaxSec=5
PollIntervalMinSec=32
PollIntervalMaxSec=1024
