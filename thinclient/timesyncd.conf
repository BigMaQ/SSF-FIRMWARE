[Time]
# Der Homelab-Router (UDM) antwortet nicht auf UDP 123 — geprüft am 15.11. auf
# 192.168.20.1 / .90.1 / .40.1. Also öffentliche Pools, die funktionieren:
#   0.debian.pool.ntp.org stratum 2, pool.ntp.org stratum 2, time.cloudflare.com
NTP=0.debian.pool.ntp.org 1.debian.pool.ntp.org 2.debian.pool.ntp.org
FallbackNTP=pool.ntp.org time.cloudflare.com

# Leere CMOS-Batterie: die Box startet in der Vergangenheit. Deshalb beim ersten
# Sync nicht lange messen, sondern gleich springen, und häufig genug nachsehen.
RootDistanceMaxSec=5
PollIntervalMinSec=32
PollIntervalMaxSec=1024
